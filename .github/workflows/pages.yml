name: Site

# Builds the site from site/ and its data, with the title screens from the
# release "site-images", and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/site_build.py", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Title screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download site-images -p site-images.zip; then
            mkdir site-images && unzip -q site-images.zip -d site-images
          else
            echo "no site-images release yet: the pages show no pictures"
          fi
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/site_build.py _site --images site-images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
